<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Міни</title>
    <style>
        body { background: #0d1117; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(5, 60px); gap: 8px; justify-content: center; margin: 20px auto; }
        .cell { width: 60px; height: 60px; background: #1f2937; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
        .cell.revealed { background: #2d3a4a; }
        .cell.mine { background: #f85149; }
        .cell.safe { background: #3fb950; }
        .bet-area { margin: 16px; }
        input { padding: 10px; width: 100px; border-radius: 8px; border: none; text-align: center; }
        button { background: #238636; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-size: 18px; cursor: pointer; }
        #status { margin-top: 16px; font-size: 20px; }
    </style>
</head>
<body>
    <h1>⛏️ Міни</h1>
    <div class="bet-area">
        <input type="number" id="betInput" value="1.0" step="0.5" min="0.5">
        <button onclick="startGame()">Почати гру</button>
    </div>
    <div class="grid" id="grid"></div>
    <div id="status">Ставка 1 GIFT</div>

    <script>
        const SIZE = 5;
        const MINES = 3;
        let grid = [];
        let revealed = [];
        let gameOver = false;
        let bet = 1.0;

        function initGrid() {
            grid = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
            revealed = Array(SIZE).fill().map(() => Array(SIZE).fill(false));
            let placed = 0;
            while (placed < MINES) {
                let x = Math.floor(Math.random() * SIZE);
                let y = Math.floor(Math.random() * SIZE);
                if (grid[x][y] === 0) {
                    grid[x][y] = 1;
                    placed++;
                }
            }
            gameOver = false;
            document.getElementById('status').innerText = 'Клікай на клітинки!';
            renderGrid();
        }

        function renderGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.x = i;
                    cell.dataset.y = j;
                    if (revealed[i][j]) {
                        cell.classList.add('revealed');
                        if (grid[i][j] === 1) {
                            cell.classList.add('mine');
                            cell.innerText = '💣';
                        } else {
                            cell.classList.add('safe');
                            cell.innerText = '✅';
                        }
                    }
                    cell.addEventListener('click', () => revealCell(i, j));
                    gridEl.appendChild(cell);
                }
            }
        }

        function revealCell(x, y) {
            if (gameOver || revealed[x][y]) return;
            revealed[x][y] = true;

            if (grid[x][y] === 1) {
                gameOver = true;
                document.getElementById('status').innerText = '💥 Міна! Ви програли.';
                sendResult(0);
                renderGrid();
                return;
            }

            renderGrid();

            let allSafe = true;
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    if (grid[i][j] === 0 && !revealed[i][j]) allSafe = false;
                }
            }
            if (allSafe) {
                gameOver = true;
                const win = bet * 2;
                document.getElementById('status').innerText = 🎉 Виграш! +${win} GIFT;
                sendResult(win);
            }
        }function sendResult(win) {
            const betVal = parseFloat(document.getElementById('betInput').value) || 1.0;
            window.Telegram.WebApp.sendData(JSON.stringify({ bet: betVal, win: win }));
        }

        function startGame() {
            bet = parseFloat(document.getElementById('betInput').value) || 1.0;
            document.getElementById('status').innerText = Ставка: ${bet} GIFT;
            initGrid();
        }

        window.Telegram.WebApp.ready();
        initGrid();
    </script>
</body>
