<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мины — ставка</title>
    <style>
        body {
            background: #0d1117;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
        }
        .grid {
            display: grid;
            gap: 6px;
            justify-content: center;
            margin: 16px auto;
        }
        .cell {
            width: 50px;
            height: 50px;
            background: #1f2937;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            user-select: none;
        }
        .cell.opened {
            background: #2d3a4a;
        }
        .cell.mine {
            background: #f85149;
        }
        .cell.safe {
            background: #3fb950;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 16px 0;
        }
        .controls label {
            display: flex;
            flex-direction: column;
            font-size: 14px;
            color: #8b949e;
        }
        .controls input, .controls select {
            padding: 8px;
            border-radius: 8px;
            border: none;
            background: #1f2937;
            color: white;
            font-size: 16px;
            margin-top: 4px;
        }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            margin: 6px;
        }
        button.danger {
            background: #da3633;
        }
        #multiplier {
            font-size: 28px;
            color: #f0883e;
        }
        #status {
            margin-top: 16px;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>⛏️ Мины</h1>

    <div class="controls">
        <label>Размер поля
            <select id="sizeSelect">
                <option value="3">3×3</option>
                <option value="5" selected>5×5</option>
                <option value="10">10×10</option>
            </select>
        </label>
        <label>Количество мин
            <input type="number" id="minesInput" value="2" min="1" max="20">
        </label>
        <label>Ставка
            <input type="number" id="betInput" value="1.0" step="0.5" min="0.5">
        </label>
    </div>

    <button onclick="makeBet()">💰 Сделать ставку</button>

    <div id="multiplier">x1.00</div>
    <button onclick="cashOut()" class="danger">🏦 Забрать</button>

    <div class="grid" id="grid"></div>
    <div id="status">Выбери параметры и нажми «Сделать ставку»</div>

    <script>
        let grid = [], opened = [], gameOver = false, gameActive = false;
        let bet = 1.0, multiplier = 1.0, safeClicks = 0;
        let size = 5, minesCount = 2;

        function makeBet() {
            size = parseInt(document.getElementById('sizeSelect').value);
            minesCount = parseInt(document.getElementById('minesInput').value) || 2;
            bet = parseFloat(document.getElementById('betInput').value) || 1.0;

            if (minesCount >= size * size) {
                document.getElementById('status').innerText = '❌ Мин слишком много!';
                return;
            }

            // Создаём поле
            grid = Array(size).fill().map(() => Array(size).fill(0));
            opened = Array(size).fill().map(() => Array(size).fill(false));

            let placed = 0;
            while (placed < minesCount) {
                let x = Math.floor(Math.random() * size);
                let y = Math.floor(Math.random() * size);
                if (grid[x][y] === 0) {
                    grid[x][y] = 1;
                    placed++;
                }
            }
            gameOver = false;
            gameActive = true;
            safeClicks = 0;
            multiplier = 1.0;
            document.getElementById('multiplier').innerText = 'x1.00';
            document.getElementById('status').innerText = Ставка ${bet} GIFT · Кликай!;
            renderGrid();
        }

        function renderGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            gridEl.style.gridTemplateColumns = repeat(${size}, 50px);

            for (let i = 0; i < size; i++) {
                for (let j = 0; j < size; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (opened[i][j]) {
                        cell.classList.add('opened');
                        cell.innerText = grid[i][j] === 1 ? '💣' : '✅';
                        if (grid[i][j] === 1) cell.classList.add('mine');
                        else cell.classList.add('safe');
                    }
                    cell.addEventListener('click', () => revealCell(i, j));
                    gridEl.appendChild(cell);
                }
            }
        }

        function revealCell(x, y) {
            if (gameOver  !gameActive  opened[x][y]) return;
            opened[x][y] = true;

            if (grid[x][y] === 1) {
                gameOver = true;
                gameActive = false;
                document.getElementById('status').innerText = '💥 Мина! Ты проиграл.';
                renderGrid();
                sendResult(0);
                return;
            }

            safeClicks++;
            multiplier = 1.0 + safeClicks * 0.1;
            document.getElementById('multiplier').innerText = x${multiplier.toFixed(2)};
            renderGrid();

            if (safeClicks === size * size - minesCount) {
                gameOver = true;
                gameActive = false;
                const win = bet * multiplier;
                document.getElementById('status').innerText = 🎉 Все клетки открыты! +${win.toFixed(2)} GIFT;
                sendResult(win);
            }
        }

        function cashOut() {
            if (!gameActive || gameOver) {
                document.getElementById('status').innerText = '❌ Игра не активна';
                return;
            }
            const win = bet * multiplier;
            gameOver = true;
            gameActive = false;
            document.getElementById('status').innerText = ✅ Забрано: ${win.toFixed(2)} GIFT (x${multiplier.toFixed(2)});
            sendResult(win);
        }

        function sendResult(win) {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.sendData(JSON.stringify({ bet: bet, win: win }));
            } else {
                console.log('Результат:', { bet: bet, win: win });
            }
        }

        if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.ready();

        // Показываем пустое поле при загрузке
        size = 5;
        grid = Array(size).fill().map(() => Array(size).fill(0));
        opened = Array(size).fill().map(() => Array(size).fill(false));
        renderGrid();
        document.getElementById('status').innerText = 'Выбери параметры и нажми «Сделать ставку»';
    </script>
</body>
</html>
